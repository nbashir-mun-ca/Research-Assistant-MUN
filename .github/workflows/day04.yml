name: Day 4 computational checks

on:
  push:
    paths:
      - 'day04/**'
      - 'requirements.txt'
      - '.github/workflows/day04.yml'
  pull_request:
    paths:
      - 'day04/**'
      - 'requirements.txt'
      - '.github/workflows/day04.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python day04/day4_example.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: day04-computational-evidence
          path: day04/results/
